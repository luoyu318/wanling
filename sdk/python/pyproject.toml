[project]
name = "wanling-sdk"
version = "0.3.0"
description = "Wanling AI Agent SDK - transport layer for building agent plugins"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=13,<16",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wanling_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
