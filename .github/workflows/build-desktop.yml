name: 桌面版构建测试

# spike 分支测试用:手动触发 + push 到 spike 分支自动触发
# 验证 Windows/macOS 桌面构建可行性,产物上传到 workflow artifact(不碰 release)
on:
  push:
    branches: [spike/**]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 构建 Windows
        env:
          # windows-latest 的 VS 18 MSVC 已移除 /await 旧协程语法,permission_handler_windows
          # 等插件仍触发 STL1011。CL 环境变量全局注入抑制宏(微软官方推荐的过渡方案)。
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      # 不自行 zip:浏览器下载 artifact 时 GitHub 会统一打包,预打包会双层压缩。
      # 通配符铺平上传,下载解压即得 app.exe + dll + data/ 完整运行目录。
      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: wanling-windows-x64-desktop
          path: desktop/build/windows/x64/runner/Release/*
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 构建 macOS
        run: flutter build macos --release

      # 不自行 zip(避免与 GitHub artifact 下载层双层压缩),
      # 直接上传 .app 目录,浏览器下载解压即得可运行的 app.app。
      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: wanling-macos-universal-desktop
          path: desktop/build/macos/Build/Products/Release/*.app
          retention-days: 7