name: wanling_core
description: 万灵业务核心层（models/services/providers/rendering/utils），移动壳与桌面壳共享。

# 与 app 保持一致的 SDK 约束（复制自 app/pubspec.yaml 的 environment 段）
environment:
  sdk: ^3.10.8

publish_to: none

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  shared_preferences: ^2.2.0
  dio: ^5.4.0
  path_provider: ^2.1.6
  web_socket_channel: ^3.0.0
  markdown_widget: ^2.3.2+8
  image: ^4.5.3
  crypto: ^3.0.3
  sqlite3: ^3.5.0
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0
  go_router: ^14.0.0
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^21.0.0
  encrypt: ^5.0.3
  drift: ^2.20.0
  flutter_math_fork: ^0.7.3
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
