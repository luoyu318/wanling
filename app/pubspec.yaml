name: app
description: "万灵（Wanling）AI Agent 聊天 APP — 万物有灵·唤灵即应。"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.6.5+20

environment:
  sdk: ^3.10.8

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  # 业务核心层(monorepo path 依赖)
  wanling_core:
    path: ../packages/wanling_core
  flutter:
    sdk: flutter
  # 国际化：提供 GlobalMaterialLocalizations/GlobalWidgetsLocalizations，
  # 让 Material 内置组件（日期/时间选择器等）跟随 zh locale 显示中文。
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_slidable: ^3.1.1
  flutter_riverpod: ^2.5.0
  dio: ^5.4.0
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.2.0
  device_info_plus: ^10.1.0
  go_router: ^14.0.0
  file_picker: ^11.0.3
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  cached_network_image: ^3.4.1
  wechat_assets_picker: ^10.1.0
  crop_your_image: ^2.0.0
  flutter_local_notifications: ^21.0.0
  flutter_background_service: ^5.1.0
  permission_handler: ^11.3.1
  package_info_plus: ^8.0.0
  nested_scroll_views: ^0.0.12
  wechat_camera_picker: ^4.5.0
  mobile_scanner: ^7.2.0
  # 通知头像裁方形圆角 + 首字母色块生成(isolate 内无 Flutter widget,需纯 Dart bitmap 操作)
  image: ^4.5.3
  # 通知头像文件缓存目录(getApplicationDocumentsDirectory),avatar_bitmap 工具用
  path_provider: ^2.1.6
  gal: ^2.3.2
  scrollview_observer: ^1.26.3  # 消息列表位置保持 + index 滚动(锁 1.26.3 拿 standby 修复)
  open_filex: ^4.7.0
  # DirectoryTile 选中态目录名首尾连接无限滚动展示
  marquee: ^2.3.0
  flutter_inappwebview: ^6.1.5
  # 小程序包本地路径拼接(与 wanling_core 同版本)
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of the
  # package. See that file for information about deactivating specific lint
  # rules and activating additional lint rules.
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  # drift 代码生成
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  # 测试直接引用的包(运行时经 wanling_core 传递,测试代码 import 需在此声明)
  archive: ^4.2.0
  cryptography: ^2.9.0
  crypto: ^3.0.3
  path_provider_platform_interface: ^2.1.3
  flutter_secure_storage: ^9.2.2
  drift: ^2.20.0
  sqlite3: ^3.5.0
  markdown_widget: ^2.3.2+8

# SQLCipher build hook 配置:
# - source: sqlcipher  → 让 sqlite3 包下载 SQLCipher 编译版(默认是普通 SQLite)
# - url_pattern         → 3.4.0+ 新增,绕过 github.com 直连,走国内镜像
# 占位符语法(sqlite3/lib/src/hook/compile/description.dart:243-246):
#   $RELEASE_TAG → 如 sqlite3-3.5.0
#   $FILENAME    → 如 libsqlcipher.arm64.android.so
# 镜像测速(2026-07-22): cors.isteed.cc 424KB/s > ghproxy.net 29KB/s;
# gh-proxy.com 不可用(超时); github.com 直连时通时断不稳定。
# 反代速度抖动,换镜像前先用 curl 测速再改。
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
      url_pattern: "https://cors.isteed.cc/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"

dependency_overrides:
  # wechat_camera_picker 间接拉入 sensors_plus 7.x(需 Kotlin 2.2),
  # 但项目 Built-in Kotlin 为 2.0。固定到 6.x 兼容版本。
  sensors_plus: ^6.1.1
  # mobile_scanner 7.x 依赖 kotlinx-coroutines 1.11(需 Kotlin 2.2),
  # 但项目 Built-in Kotlin 为 2.0。精确固定到 6.0.7(coroutines 1.7.3 兼容)。
  mobile_scanner: 6.0.7
  # video_player_android 2.12.1 pigeon 生成代码重复声明 MessagesPigeonMethodCodec,
  # Kotlin 2.0 编译失败。固定到 2.12.0。
  video_player_android: 2.12.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/seal/
  #   - images/a_dot_ham.jpeg

  fonts:
    # Noto Color Emoji（CBDT/CBLC 位图格式）：修复 ♻️⚠️✂️ 等默认 text 形态 emoji
    # 在 Android 被 Roboto 抢占成单色的问题。打包进 APK 后,设为 fontFamilyFallback,
    # 让主字体找不到这些字符的彩色字形时回退到彩色 emoji 字体。
    - family: Noto Color Emoji
      fonts:
        - asset: fonts/NotoColorEmoji.ttf

    # iconfont（iconfont.cn,项目 Wanling）：聚合卡工具类别图标
    # 思考/搜索/shell/编辑/WebFetch,unicode 见 lib/utils/icon_font.dart
    - family: iconfont
      fonts:
        - asset: fonts/iconfont.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
